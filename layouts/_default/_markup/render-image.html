{{- $src := .Destination -}}

<!-- Wir säubern den Pfad für die static-Brücke -->
{{- $cleanSrc := strings.TrimPrefix "/" $src -}}
{{- $cleanSrc := strings.TrimPrefix "Bilder/" $cleanSrc -}}
{{- $permalink := printf "/Bilder/%s" $cleanSrc -}}
{{- $id := $cleanSrc | urlize -}}

<figure class="astro-photo" style="text-align: center; margin: 1.5rem 0;">
  <!-- Wir verpacken das Bild in einen unblockierbaren Klick-Container mit einer eindeutigen ID -->
  <div id="wrapper-{{ $id }}" class="astro-fullscreen-wrapper" style="display: inline-block; cursor: zoom-in;">
    <img src="{{ $permalink }}" alt="{{ .Text | default "Astrofoto" }}" class="astro-photo-frame">
  </div>
  
  {{ with .Text }}
    <figcaption style="font-style: italic; color: #888; margin-top: 8px;">{{ . }}</figcaption>
  {{ end }}
</figure>

<!-- Dieser Skript-Block ist für den Hugo-Filter unsichtbar und bindet den Klick-Befehl bombenfest an das Bild -->
<script>
  document.getElementById('wrapper-{{ $id }}').addEventListener('click', function() {
    let img = this.querySelector('img');
    if (img.requestFullscreen) {
      img.requestFullscreen();
    } else if (img.webkitRequestFullscreen) {
      img.webkitRequestFullscreen();
    }
  });
</script>
