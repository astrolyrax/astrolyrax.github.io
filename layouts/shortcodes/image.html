{{- $src := .Get 0 -}}
{{- $id := $src | urlize -}}

<!-- Pfad säubern -->
{{- $cleanSrc := strings.TrimPrefix "/" $src -}}
{{- $cleanSrc := strings.TrimPrefix "Bilder/" $cleanSrc -}}
{{- $permalink := printf "/Bilder/%s" $cleanSrc -}}

<!-- 1. Das normale Bild im Fließtext (Eingepackt in einen reinen HTML-Link auf die ID) -->
<figure class="astro-photo" style="text-align: center; margin: 1.5rem 0;">
  <a href="#lightbox-{{ $id }}">
    <img src="{{ $permalink }}" alt="Astrofoto" style="max-width: 100%; height: auto; border-radius: 24px; cursor: zoom-in;">
  </a>
</figure>

<!-- 2. Das reine HTML-Vollbild-Overlay (Springt an, wenn die ID oben in der URL aufgerufen wird) -->
<div id="lightbox-{{ $id }}" class="astro-custom-lightbox">
  <!-- Ein Klick auf das schwarze Feld oder das Bild führt zurück zum Artikel -->
  <a href="#" class="lightbox-close">
    <img src="{{ $permalink }}" alt="Astrofoto Vollbild">
  </a>
</div>
