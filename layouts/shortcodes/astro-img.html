{{- $src := .Get 0 | default (.Get "src") -}}
{{- $alt := .Get 1 | default (.Get "alt") | default "Astrofoto" -}}

<!-- Wir säubern den Pfad für das Web-Format -->
{{- $cleanSrc := strings.TrimPrefix "/" $src -}}
{{- $cleanSrc := strings.TrimPrefix "Bilder/" $cleanSrc -}}
{{- $permalink := printf "/Bilder/%s" $cleanSrc -}}

<div class="astro-lightbox-wrapper" style="text-align: center; margin: 1.5rem 0;">
  <!-- Das native HTML-Akkordeon fungiert als unblockierbare Lightbox -->
  <details class="astro-lightbox-details">
    <summary style="list-style: none; cursor: zoom-in;">
      <!-- 1. Das normale Bild im Fließtext mit Rahmen und Ecken -->
      <!-- BEIM KLICKEN: Wir zwingen dieses Bild direkt in den echten F11-Browser-Vollbildmodus! -->
      <img src="{{ $permalink }}" alt="{{ $alt }}" class="astro-photo-frame" 
           onclick="this.requestFullscreen().catch(err => {});">
    </summary>
  </details>
</div>
