{{- $src := .Get 0 -}}
<!-- Wir suchen das Bild direkt in deinem virtuellen Assets-Bilderordner -->
{{- $img := resources.Get (printf "Bilder/%s" (strings.TrimPrefix "Bilder/" $src)) -}}

{{- if $img -}}
  <!-- 1. Das normale Bild im Fließtext (mit deinen runden Ecken und blauem Rand) -->
  <figure class="astro-photo">
    <img src="{{ $img.RelPermalink }}" alt="Astrofoto" style="max-width: 100%; height: auto; border-radius: 4px; cursor: zoom-in;" 
         onclick="let container = document.getElementById('lb-container-{{ $src | urlize }}'); container.style.display = 'flex'; if (container.requestFullscreen) { container.requestFullscreen(); } else if (container.webkitRequestFullscreen) { container.webkitRequestFullscreen(); }">
  </figure>

  <!-- 2. Das unfehlbare Vollbild-Overlay (wird erst bei Klick sichtbar) -->
  <div id="lb-container-{{ $src | urlize }}" class="astro-custom-lightbox" style="display: none;" onclick="if (document.exitFullscreen) { document.exitFullscreen(); } else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } this.style.display = 'none';">
    <img src="{{ $img.RelPermalink }}" alt="Astrofoto Vollbild">
  </div>
{{- else -}}
  <div style="background: #fee; border: 1px solid #f99; padding: 10px; color: #c00; font-family: monospace;">
    ⚠️ Astrofoto nicht im Bilderordner gefunden: {{ $src }}
  </div>
{{- end -}}
